# Fase 5D — Build installer NSIS + uji E2E penuh di windows-latest (tanpa Windows lokal).
# Prasyarat repo: GitHub Secret `LICENSE_SECRET` (jangan pernah commit nilai secret).
# Bukti di-upload sebagai artefak: installer, screenshot UI, PDF, tasklist, e2e-summary.json.
name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main, baseline/working-copy]
    paths:
      - "client/**"
      - "server/**"
      - "src-tauri/**"
      - "e2e/**"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build-e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ===== Persiapan (BUILD-WINDOWS.md) =====
      - name: Suntik .env dari Secrets (runtime CI — tidak di-commit)
        run: |
          if (-not $env:LICENSE_SECRET) {
            Write-Host "::warning::Secret LICENSE_SECRET belum di-set — uji license valid-key dilewati (tanpa key tetap 400)"
          }
          # CATATAN: hanya LICENSE_SECRET. DATABASE_URL sengaja tidak di-set agar
          # ensureDatabaseUrl() meresolusi resources/prisma/dev.db di path ter-instal.
          "LICENSE_SECRET=$env:LICENSE_SECRET" | Set-Content -NoNewline -Encoding utf8 src-tauri/resources/.env
          $keys = (Get-Content src-tauri/resources/.env | ForEach-Object { ($_ -split '=', 2)[0] }) -join ','
          Write-Host "resources/.env ditulis (keys: $keys) — nilai tidak dicetak"

      - name: Engine Prisma Windows + bangun sidecar Express (pkg)
        run: |
          cd server
          npm ci --no-audit --no-fund
          npx prisma generate
          $engine = Get-ChildItem node_modules/.prisma/client -Filter 'query_engine.dll.node' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $engine) { $engine = Get-ChildItem node_modules/.prisma/client -Filter 'query-engine.dll.node' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $engine) { Write-Error 'Engine Prisma Windows (query_engine.dll.node) tidak ditemukan' }
          Copy-Item $engine.FullName ../src-tauri/resources/prisma/ -Force
          Write-Host "Engine disalin: $($engine.Name)"
          # Sidecar Express dibangun di CI — file 127 MB melebihi batas file GitHub (100 MB),
          # sehingga tidak di-commit di branch baseline/working-copy. Prosedur identik dengan
          # build lokal di BUILD-WINDOWS.md (sudah terverifikasi di simulasi Linux Fase 5D).
          npx --yes pkg@6.26.0 --fallback-to-source --target node24-win-x64 --output ../src-tauri/binaries/express-server-x86_64-pc-windows-msvc.exe .
          Get-Item ../src-tauri/binaries/express-server-x86_64-pc-windows-msvc.exe | Select-Object Name, Length

      - name: Build client + sinkron ke resources/client-dist
        run: |
          cd client
          npm ci --no-audit --no-fund
          npm run build
          robocopy dist ../src-tauri/resources/client-dist /MIR /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE } else { $global:LASTEXITCODE = 0 }

      - name: Verifikasi mode WebView2 (downloadBootstrapper, bukan offlineInstaller)
        run: |
          $c = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $mode = $c.bundle.windows.webviewInstallMode.type
          Write-Host "webviewInstallMode = $mode (offlineInstaller = +127 MB — tidak dipakai)"
          if ($mode -ne 'downloadBootstrapper') { Write-Error "Mode WebView2 bukan downloadBootstrapper: $mode" }

      # ===== Build =====
      - name: Verifikasi NSIS (makensis di PATH)
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path += ";${env:ProgramFiles(x86)}\NSIS"
            Write-Host "makensis tidak di PATH — '${env:ProgramFiles(x86)}\NSIS' di-append ke GITHUB_PATH"
          }
          makensis -VERSION
          Get-Command makensis | Format-List Name, Source

      - name: Tauri Build (No Bundle - untuk melihat error kompilasi)
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --no-bundle --verbose --target x86_64-pc-windows-msvc

      - name: Tauri Build (NSIS Bundle)
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis --verbose --target x86_64-pc-windows-msvc

      # CATATAN DEBUG: langkah "Ukuran installer" dihapus sesuai instruksi agar kegagalan
      # berhenti tepat di langkah build yang gagal dengan log verbatim. Ukuran installer
      # kini dicetak di langkah E2E; upload artefak tetap memakai glob *-setup.exe.

      - uses: actions/upload-artifact@v4
        with:
          name: chat2pdf-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # ===== E2E =====
      - name: E2E — install silent, UI, PDF, license, lifecycle, metrik
        run: |
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $nsis) { Write-Error 'Installer NSIS tidak ditemukan — akar masalah ada di langkah Tauri Build (NSIS Bundle), bukan di sini' }
          Write-Host "Installer: $($nsis.Name) = $([math]::Round($nsis.Length / 1MB, 2)) MB (pengganti langkah Ukuran installer)"
          & ./e2e/run-e2e.ps1 -InstallerPath $nsis.FullName

      - name: TOC — asser teks "Daftar Isi" di PDF (pdfjs)
        run: |
          cd e2e
          npm init -y | Out-Null
          npm i pdfjs-dist@4 --no-audit --no-fund
          node check-toc.mjs artifacts/out-toc.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          if-no-files-found: error
          path: |
            e2e/artifacts/ui-screenshot.png
            e2e/artifacts/out.pdf
            e2e/artifacts/out-toc.pdf
            e2e/artifacts/e2e-summary.json
            e2e/artifacts/tasklist-before.txt
            e2e/artifacts/tasklist-after.txt
            e2e/artifacts/processes-after-close.txt
