# Fase 5D - Build installer NSIS + uji E2E penuh di windows-latest
name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main, baseline/working-copy]
    paths:
      - "client/**"
      - "server/**"
      - "src-tauri/**"
      - "e2e/**"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build-e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Suntik .env dari Secrets
        run: |
          if (-not $env:LICENSE_SECRET) {
            Write-Host "::warning::Secret LICENSE_SECRET belum di-set"
          }
          "LICENSE_SECRET=$env:LICENSE_SECRET" | Set-Content -NoNewline -Encoding utf8 src-tauri/resources/.env

      - name: Engine Prisma Windows + bangun sidecar Express (pkg)
        run: |
          cd server
          npm ci --no-audit --no-fund
          npx prisma generate
          
          # Cari query engine Windows yang baru di-generate
          $engineSource = Get-ChildItem -Path "node_modules\@prisma\engines" -Filter "*query_engine*windows*.node" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $engineSource) {
            $engineSource = Get-ChildItem -Path "node_modules\.prisma\client" -Filter "*query_engine*windows*.node" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $engineSource) {
            Write-Error "Engine Prisma Windows tidak ditemukan di node_modules"
            exit 1
          }
          Copy-Item $engineSource.FullName -Destination "../src-tauri\resources\prisma\query_engine.dll.node" -Force
          Write-Host "Copied $($engineSource.Name) -> query_engine.dll.node"
          
          # Bangun sidecar Express menggunakan fork @yao-pkg/pkg
          npx --yes @yao-pkg/pkg@6.19.0 --target node24-win-x64 --output ../src-tauri/binaries/express-server-x86_64-pc-windows-msvc.exe .
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "pkg gagal membuat binary. Periksa log di atas."
            exit 1
          }
          Get-Item ../src-tauri/binaries/express-server-x86_64-pc-windows-msvc.exe | Select-Object Name, Length

      - name: Build client + sinkron ke resources/client-dist
        run: |
          cd client
          npm ci --no-audit --no-fund
          npm run build
          robocopy dist ../src-tauri/resources/client-dist /MIR /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE } else { $global:LASTEXITCODE = 0 }

      - name: Verifikasi mode WebView2
        run: |
          $c = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $mode = $c.bundle.windows.webviewInstallMode.type
          Write-Host "webviewInstallMode = $mode"
          if ($mode -ne 'downloadBootstrapper') { Write-Error "Mode WebView2 bukan downloadBootstrapper: $mode" }

      - name: Verifikasi NSIS (makensis di PATH)
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path += ";${env:ProgramFiles(x86)}\NSIS"
          }
          makensis -VERSION
          Get-Command makensis | Format-List Name, Source

      - name: Tauri Build (No Bundle)
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --no-bundle --verbose --target x86_64-pc-windows-msvc

      - name: Tauri Build (NSIS Bundle)
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis --verbose --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: chat2pdf-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: E2E - install silent, UI, PDF, license, lifecycle, metrik
        run: |
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $nsis) { Write-Error 'Installer NSIS tidak ditemukan' }
          Write-Host "Installer: $($nsis.Name) = $([math]::Round($nsis.Length / 1MB, 2)) MB"
          & ./e2e/run-e2e.ps1 -InstallerPath $nsis.FullName

      - name: TOC - asser teks Daftar Isi di PDF (pdfjs)
        run: |
          cd e2e
          npm init -y | Out-Null
          npm i pdfjs-dist@4 --no-audit --no-fund
          node check-toc.mjs artifacts/out-toc.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          if-no-files-found: error
          path: |
            e2e/artifacts/ui-screenshot.png
            e2e/artifacts/out.pdf
            e2e/artifacts/out-toc.pdf
            e2e/artifacts/e2e-summary.json
            e2e/artifacts/tasklist-before.txt
            e2e/artifacts/tasklist-after.txt
            e2e/artifacts/processes-after-close.txt